services:
  db:
    image: postgres:16
    container_name: cancelfill_postgres
    environment:
      POSTGRES_DB: cancelfill
      POSTGRES_USER: cancelfill
      POSTGRES_PASSWORD: cancelfill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancelfill -d cancelfill"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
